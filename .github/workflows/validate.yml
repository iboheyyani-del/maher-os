
name: Maher OS Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JSON configuration
        run: python -m json.tool maher-os.json

      - name: Check required files
        run: |
          test -f README.md
          test -f SPECIFICATION.md
          test -f core/maher_core.py
          test -f tests/test_maher_core.py
          echo "Maher OS files verified."

      - name: Run Maher Core tests
        run: python -m unittest discover -s tests -v
