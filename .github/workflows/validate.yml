
name: Maher OS Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON configuration
        run: python -m json.tool maher-os.json

      - name: Check required documentation
        run: |
          test -f README.md
          test -f SPECIFICATION.md
          echo "Maher OS project files exist."
